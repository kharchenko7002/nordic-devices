server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: alle ukjente ruter sendes til index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache for statiske ressurser
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Gzip-komprimering
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
