# Standard HTTP-konfigurasjon brukes når Docker Compose kjøres uten HTTPS-override.
server {
    listen 80;
    server_name _;

    # Felles sikkerhetshoder
    add_header X-Content-Type-Options "nosniff"               always;
    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection       "1; mode=block"         always;

    root /usr/share/nginx/html;
    index index.html;

    # API-trafikk videresendes til backend-containeren (nordic-api:4000).
    location /api/ {
        proxy_pass         http://nordic-api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
