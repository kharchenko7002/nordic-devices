# Utvidet konfigurasjon med HTTPS støttet av self-signed sertifikat.
# Brukes når containeren startes med docker-compose.https.yml override.

server {
    listen 80;
    server_name _;

    # All HTTP-trafikk omdirigeres til HTTPS når sertifikatet er på plass.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nordic-devices.crt;
    ssl_certificate_key /etc/nginx/certs/nordic-devices.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"           always;
    add_header X-XSS-Protection          "1; mode=block"                        always;

    root /usr/share/nginx/html;
    index index.html;

    # API-trafikk videresendes til backend-containeren (nordic-api:4000).
    location /api/ {
        proxy_pass         http://nordic-api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
